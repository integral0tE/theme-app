<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="テーマ生成">
<link rel="apple-touch-icon" href="icon.png">
<title>テーマジェネレーター</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 60px;
    color: #2d3748;
  }

  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #2b6cb0;
    letter-spacing: 0.05em;
  }
  .header p {
    font-size: 12px;
    color: #718096;
    margin-top: 4px;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 18px 16px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 12px;
  }

  /* ─── Filters ─── */
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: #718096;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .pill-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill {
    border: 1.5px solid #e2e8f0;
    background: #fff;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
    color: #4a5568;
    white-space: nowrap;
    user-select: none;
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  .pill:active { transform: scale(0.95); }
  .pill.active { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; font-weight: 600; }

  .scope-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .scope-pill {
    border: 1.5px solid #e2e8f0;
    background: #fff;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
    color: #4a5568;
    user-select: none;
    min-height: 40px;
    display: flex;
    align-items: center;
  }
  .scope-pill:active { transform: scale(0.95); }
  .scope-pill.active { background: #faf5ff; border-color: #805ad5; color: #553c9a; font-weight: 600; }

  /* ─── Theme Display ─── */
  .theme-display {
    background: linear-gradient(135deg, #ebf8ff 0%, #e9d8fd 100%);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .theme-display.loading {
    background: linear-gradient(135deg, #e2e8f0 0%, #edf2f7 100%);
  }
  .theme-badge {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .badge {
    background: rgba(255,255,255,0.7);
    border-radius: 10px;
    padding: 3px 10px;
    font-size: 12px;
    color: #553c9a;
    font-weight: 600;
  }
  .badge.scope-badge { color: #2b6cb0; }
  .theme-text {
    font-size: 22px;
    font-weight: 700;
    color: #2d3748;
    line-height: 1.45;
  }
  .theme-hint {
    font-size: 13px;
    color: #718096;
    background: rgba(255,255,255,0.65);
    border-radius: 8px;
    padding: 8px 14px;
    line-height: 1.6;
    text-align: left;
  }
  .placeholder-text {
    font-size: 15px;
    color: #a0aec0;
  }

  /* ─── Buttons ─── */
  .btn-row {
    display: flex;
    gap: 10px;
  }
  .btn {
    flex: 1;
    padding: 0 16px;
    height: 54px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    user-select: none;
  }
  .btn:active { transform: scale(0.96); opacity: .85; }
  .btn-random { background: #2b6cb0; color: #fff; }
  .btn-ai { background: linear-gradient(135deg, #805ad5, #3182ce); color: #fff; }
  .btn:disabled { opacity: .45; }

  /* ─── History ─── */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    background: #f7fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    padding: 13px 14px;
    cursor: pointer;
    transition: background .15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 52px;
    user-select: none;
  }
  .history-item:active { background: #ebf8ff; }
  .history-item-text { font-size: 14px; color: #2d3748; flex: 1; line-height: 1.4; }
  .history-item-meta { font-size: 11px; color: #a0aec0; white-space: nowrap; }

  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2.5px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-history {
    text-align: center;
    font-size: 13px;
    color: #a0aec0;
    padding: 16px;
  }

  .divider {
    border: none;
    border-top: 1.5px solid #e2e8f0;
    margin: 4px 0 14px;
  }
</style>
</head>

<div class="header">

  <p>リハビリプログラム用 ・ 60分調べ→5分発表</p>
</div>

      <div class="scope-pill" data-scope="なし" onclick="setScope(this,'なし')">― スコープなし</div>
    </div>
  </div>

  <hr class="divider" style="margin-top:16px">

  <!-- Theme Display -->
  <div class="theme-display" id="themeDisplay">
    <div class="placeholder-text">↓ ボタンを押してテーマを取得</div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">

    <button class="btn btn-ai" id="aiBtn" onclick="generateAI()">✨ テーマを生成</button>
  </div>
</div>

<!-- History Card -->
<div class="card">

  <div class="history-list" id="historyList">

</div>

function generateFromTemplate() {
  const cats = selectedCategory === "all"
    ? ["recommend","knowledge","lifestyle","trivia","relationship","self"]
    : [selectedCategory];

  const candidates = [];
  for (const cat of cats) {
    const tmpl = TMPL[cat];
    if (!tmpl) continue;
    const scopes = selectedScope === "all"
      ? Object.keys(tmpl).filter(k => k !== "patterns")
      : [selectedScope, "なし"];
    for (const scope of [...new Set(scopes)]) {
      const items = tmpl[scope];
      if (items && items.length > 0) {
        candidates.push({ cat, scope, items, patterns: tmpl.patterns });
      }
    }
  }
  if (candidates.length === 0) return null;

  const pool = candidates[Math.floor(Math.random() * candidates.length)];
  const item = pool.items[Math.floor(Math.random() * pool.items.length)];
  const pattern = pool.patterns[Math.floor(Math.random() * pool.patterns.length)];

  return {
    text: pattern.replace("{noun}", item[0]),
    hint: item[1],
    category: pool.cat,
    scope: pool.scope,
  };
}

// ─────────────────────────────────────────
// FILTERS
// ─────────────────────────────────────────
function setCategory(el, cat) {
  selectedCategory = cat;
  document.querySelectorAll("#categoryGroup .pill").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
}

function setScope(el, scope) {
  selectedScope = scope;
  document.querySelectorAll("#scopeGroup .scope-pill").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
}

function filteredThemes() {
  return THEMES.filter(t => {
    const catMatch = selectedCategory === "all" || t.category === selectedCategory;
    const scopeMatch = selectedScope === "all" || t.scope === selectedScope;
    return catMatch && scopeMatch;
  });
}

// ─────────────────────────────────────────
// DISPLAY
// ─────────────────────────────────────────
function displayTheme(theme, source) {
  const el = document.getElementById("themeDisplay");
  const catLabel = {
    recommend:"⭐ おすすめ", knowledge:"🧠 心理学・知識", lifestyle:"🌿 生活・ケア",
    trivia:"💡 雑学", relationship:"🤝 人間関係", self:"✨ 自己探求"
  }[theme.category] || theme.category;

  let badgesHTML = `<span class="badge">${catLabel}</span>`;
  if (theme.scope && theme.scope !== "なし") {
    badgesHTML += `<span class="badge scope-badge">📍 ${theme.scope}</span>`;
  }
  if (source === "ai") {
    badgesHTML += `<span class="badge" style="color:#805ad5">✨ AI生成</span>`;
  }

  el.innerHTML = `
    <div class="theme-badge">${badgesHTML}</div>
    <div class="theme-text">「${theme.text}」</div>
    ${theme.hint ? `<div class="theme-hint">💡 ${theme.hint}</div>` : ""}
  `;
  el.classList.remove("loading");

  // Add to history
  addHistory(theme, source);
  currentTheme = theme;
}

function addHistory(theme, source) {
  history.unshift({ theme, source, time: new Date() });
  if (history.length > 20) history.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById("historyList");
  if (history.length === 0) {
    el.innerHTML = `<div class="empty-history">まだテーマが選ばれていません</div>`;
    return;
  }
  el.innerHTML = history.map((h, i) => {
    const timeStr = h.time.toLocaleTimeString("ja-JP", {hour:"2-digit", minute:"2-digit"});
    const aiTag = h.source === "ai" ? " ✨" : "";
    return `<div class="history-item" onclick="restoreHistory(${i})">
      <span class="history-item-text">${h.theme.text}${aiTag}</span>
      <span class="history-item-meta">${timeStr}</span>
    </div>`;
  }).join("");
}

function restoreHistory(idx) {
  displayThemeFromHistory(history[idx].theme, history[idx].source);
}

function displayThemeFromHistory(theme, source) {
  const el = document.getElementById("themeDisplay");
  const catLabel = {
    recommend:"⭐ おすすめ", knowledge:"🧠 心理学・知識", lifestyle:"🌿 生活・ケア",
    trivia:"💡 雑学", relationship:"🤝 人間関係", self:"✨ 自己探求"
  }[theme.category] || theme.category;

  let badgesHTML = `<span class="badge">${catLabel}</span>`;
  if (theme.scope && theme.scope !== "なし") {
    badgesHTML += `<span class="badge scope-badge">📍 ${theme.scope}</span>`;
  }
  if (source === "ai") {
    badgesHTML += `<span class="badge" style="color:#805ad5">✨ AI生成</span>`;
  }

  el.innerHTML = `
    <div class="theme-badge">${badgesHTML}</div>
    <div class="theme-text">「${theme.text}」</div>
    ${theme.hint ? `<div class="theme-hint">💡 ${theme.hint}</div>` : ""}
  `;
  el.classList.remove("loading");
}

// ─────────────────────────────────────────
// RANDOM
// ─────────────────────────────────────────
function showRandom() {
  const pool = filteredThemes();
  if (pool.length === 0) {
    const el = document.getElementById("themeDisplay");
    el.innerHTML = `<div class="placeholder-text" style="color:#e53e3e">条件に合うテーマがありません。フィルターを変えてみてください。</div>`;
    return;
  }
  const theme = pool[Math.floor(Math.random() * pool.length)];
  displayTheme(theme, "preset");
}

// ─────────────────────────────────────────
// GENERATE (template-based)
// ─────────────────────────────────────────
function generateAI() {
  if (isGenerating) return;
  isGenerating = true;

  const btn = document.getElementById("aiBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> 生成中…`;

  const el = document.getElementById("themeDisplay");
  el.classList.add("loading");
  el.innerHTML = `<div class="placeholder-text">テーマを考えています…</div>`;

  setTimeout(() => {
    const recentTexts = new Set(history.slice(0, 12).map(h => h.theme.text));
    let theme = null;
    for (let i = 0; i < 8; i++) {
      const candidate = generateFromTemplate();
      if (!candidate) break;
      if (!recentTexts.has(candidate.text)) { theme = candidate; break; }
      if (!theme) theme = candidate;
    }

    if (theme) {
      displayTheme(theme, "ai");
    } else {
      el.classList.remove("loading");
      el.innerHTML = `<div class="placeholder-text" style="color:#e53e3e">条件に合うテーマが見つかりません。フィルターを変えてみてください。</div>`;
    }

    isGenerating = false;
    btn.disabled = false;
    btn.innerHTML = "✨ テーマを生成";
  }, 400);
}
